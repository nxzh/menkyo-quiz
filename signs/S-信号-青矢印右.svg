<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" version="1.1" width="1200" height="620" viewBox="0 0 1200 620">
  <title>車両用信号機：赤色の灯火と右向きの青色の灯火の矢印</title>
  <desc>Vehicle traffic light showing a steady red lamp with a green right-arrow lamp below. Drawn for menkyo-quiz; not a reproduction of any catalogue artwork.</desc>

  <!-- housing -->
  <rect x="30" y="30" width="1140" height="300" rx="40" fill="#3a3f44"/>
  <rect x="55" y="55" width="1090" height="250" rx="22" fill="#15181b"/>

  <!-- lamps, left to right: green, amber, red (Japanese horizontal head) -->
  <circle cx="240" cy="180" r="98" fill="#1d2226"/>
  <circle cx="240" cy="180" r="90" fill="#2c3237"/>
  <circle cx="600" cy="180" r="98" fill="#1d2226"/>
  <circle cx="600" cy="180" r="90" fill="#2c3237"/>
  <circle cx="960" cy="180" r="98" fill="#7a1418"/>
  <circle cx="960" cy="180" r="90" fill="#e8342c"/>
  <circle cx="960" cy="180" r="60" fill="#ff6a5e" opacity="0.55"/>

  <!-- arrow panel -->
  <rect x="690" y="345" width="480" height="245" rx="34" fill="#3a3f44"/>
  <rect x="712" y="367" width="436" height="201" rx="20" fill="#15181b"/>
  <g fill="#19b85a">
    <rect x="762" y="443" width="230" height="50" rx="8"/>
    <path d="M 962 398 L 1102 468 L 962 538 Z"/>
  </g>
  <g fill="#6ff0a4" opacity="0.5">
    <rect x="782" y="455" width="190" height="26" rx="6"/>
  </g>

  <!-- pole -->
  <rect x="575" y="330" width="50" height="60" fill="#3a3f44"/>
</svg>
