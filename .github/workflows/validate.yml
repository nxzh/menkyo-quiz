name: validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate question bank
        run: python3 tools/validate.py
      - name: Coverage report
        run: python3 tools/stats.py
      - name: Ledger matches the question bank
        run: python3 tools/link_ledger.py --check
      - name: Coverage document matches the ledger
        run: python3 tools/coverage.py --check
      - name: Pack generator tests
        run: python3 -m unittest discover -s tools -p 'test_*.py' -v
      - name: Mirrored files match the app repository
        run: python3 tools/check_mirrors.py
      - name: Search terms agree with the glossary
        run: python3 tools/build_search_terms.py --validate dist/terms.json
      - name: dist/ matches the question bank
        run: python3 tools/build_packs.py --check
