name: validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate question bank
        run: python3 tools/validate.py
      - name: Coverage report
        run: python3 tools/stats.py
      - name: Pack generator tests
        run: python3 -m unittest discover -s tools -p 'test_*.py' -v
      - name: dist/ matches the question bank
        run: python3 tools/build_packs.py --check
